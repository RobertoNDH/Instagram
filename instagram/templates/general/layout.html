{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block head_title %}InstaNDH{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-page text-color">
    
    <div class="d-flex min-vh-100 flex-column flex-md-row">
      
      <!-- Navegación Escritorio -->
      {% include '_includes/_sidebar.html' %}

      <!-- Navegación Superior Móvil -->
      {% include '_includes/_mobile_header.html' %}

      <!-- Contenido Principal -->
      <main class="main-content flex-grow-1">
        {% block page_content %}
        {% endblock %}
      </main>

      <!-- Navegación Inferior Móvil -->
      {% include '_includes/_bottom_nav.html' %}

    </div>

    {% include '_includes/_footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Like buttons logic
      const likeButtons = document.querySelectorAll('a.likeButton');
      likeButtons.forEach(likeButton => {
        let nLikesSpan = likeButton.querySelector('span');
        let nLikes = parseInt(nLikesSpan.innerHTML);
        likeButton.addEventListener('click', (event) => {
          event.preventDefault();
          fetch(likeButton.href)
            .then(response => response.json())
            .then(data => {
              if (data.liked) {
                nLikes += 1;
                likeButton.innerHTML = `<span>${nLikes} Me gusta</span> <i class="bi bi-suit-heart-fill icon-liked fs-4"></i>`;
              } else {
                nLikes -= 1;
                likeButton.innerHTML = `<span>${nLikes} Me gusta</span> <i class="bi bi-heart fs-4 text-color"></i>`;
              }
            });
        });
      });

      // Theme toggle logic (Applies to both mobile and desktop buttons)
      const themeToggleBtns = [document.getElementById('theme-toggle'), document.getElementById('theme-toggle-mobile')];
      themeToggleBtns.forEach(btn => {
        if(btn) {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            
            // Modify icons
            document.querySelectorAll('#theme-icon, #theme-icon-mobile').forEach(i => {
               i.className = newTheme === 'light' ? 'bi bi-moon fs-4' : 'bi bi-brightness-high fs-4';
            });
          });
        }
      });
    });
  </script>
</body>
</html>
